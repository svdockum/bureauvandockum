<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <!-- Illustratie, geen echte meting: een schets van een productpagina met een heatmap erover. -->
  <defs>
    <radialGradient id="warmte">
      <stop offset="0" stop-color="#D7191C" stop-opacity=".9"/>
      <stop offset=".3" stop-color="#F46D43" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#FEE08B" stop-opacity=".65"/>
      <stop offset=".8" stop-color="#91CF60" stop-opacity=".35"/>
      <stop offset="1" stop-color="#91CF60" stop-opacity="0"/>
    </radialGradient>
    <filter id="zacht" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Browservenster -->
  <rect x=".75" y=".75" width="798.5" height="518.5" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <path d="M1 36h798" stroke="#111111" stroke-width="1.5"/>
  <circle cx="20" cy="18" r="5" fill="#D6D6D2"/><circle cx="38" cy="18" r="5" fill="#D6D6D2"/><circle cx="56" cy="18" r="5" fill="#D6D6D2"/>
  <rect x="200" y="10" width="400" height="16" rx="8" fill="#EDEDEA"/>

  <!-- Kop met logo en menu -->
  <rect x="32" y="58" width="96" height="22" rx="2" fill="#111111"/>
  <rect x="470" y="65" width="54" height="9" rx="2" fill="#C9C9C4"/>
  <rect x="540" y="65" width="54" height="9" rx="2" fill="#C9C9C4"/>
  <rect x="610" y="65" width="54" height="9" rx="2" fill="#C9C9C4"/>
  <rect x="680" y="65" width="88" height="9" rx="2" fill="#C9C9C4"/>
  <path d="M32 100h736" stroke="#E5E5E1"/>

  <!-- Productfoto -->
  <rect x="32" y="124" width="352" height="300" rx="4" fill="#EDEDEA"/>
  <circle cx="290" cy="196" r="26" fill="#D6D6D2"/>
  <path d="M72 396l96-130 64 84 42-50 82 96z" fill="#D6D6D2"/>
  <rect x="32" y="440" width="108" height="56" rx="4" fill="#EDEDEA"/>
  <rect x="154" y="440" width="108" height="56" rx="4" fill="#EDEDEA"/>
  <rect x="276" y="440" width="108" height="56" rx="4" fill="#EDEDEA"/>

  <!-- Titel, prijs, tekst, maten en knop -->
  <rect x="416" y="126" width="150" height="8" rx="2" fill="#DADAD6"/>
  <rect x="416" y="150" width="310" height="22" rx="2" fill="#2A2A2A"/>
  <rect x="416" y="180" width="220" height="22" rx="2" fill="#2A2A2A"/>
  <rect x="416" y="224" width="112" height="26" rx="2" fill="#111111"/>
  <rect x="416" y="272" width="340" height="8" rx="2" fill="#DADAD6"/>
  <rect x="416" y="290" width="320" height="8" rx="2" fill="#DADAD6"/>
  <rect x="416" y="308" width="250" height="8" rx="2" fill="#DADAD6"/>
  <rect x="416.5" y="336.5" width="40" height="32" rx="4" fill="none" stroke="#C9C9C4"/>
  <rect x="466.5" y="336.5" width="40" height="32" rx="4" fill="none" stroke="#111111"/>
  <rect x="516.5" y="336.5" width="40" height="32" rx="4" fill="none" stroke="#C9C9C4"/>
  <rect x="566.5" y="336.5" width="40" height="32" rx="4" fill="none" stroke="#C9C9C4"/>
  <rect x="416" y="388" width="224" height="46" rx="6" fill="#111111"/>
  <rect x="468" y="407" width="120" height="8" rx="2" fill="#FFFFFF"/>

  <!-- Heatmap: hoe roder, hoe langer er gekeken is -->
  <g filter="url(#zacht)" opacity=".85">
    <circle cx="205" cy="250" r="118" fill="url(#warmte)"/>
    <circle cx="505" cy="170" r="88" fill="url(#warmte)"/>
    <circle cx="468" cy="238" r="64" fill="url(#warmte)"/>
    <circle cx="525" cy="410" r="78" fill="url(#warmte)"/>
    <circle cx="80" cy="69" r="44" fill="url(#warmte)" opacity=".6"/>
    <circle cx="490" cy="292" r="56" fill="url(#warmte)" opacity=".5"/>
    <circle cx="488" cy="352" r="40" fill="url(#warmte)" opacity=".5"/>
    <circle cx="86" cy="468" r="40" fill="url(#warmte)" opacity=".45"/>
    <circle cx="505" cy="70" r="30" fill="url(#warmte)" opacity=".3"/>
  </g>
</svg>
